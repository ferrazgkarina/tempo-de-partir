<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f5f1" />

    <!-- SEO Básico -->
    <title>Tempo de Partir | Revista Digital de Viagens e Cultura</title>
    <meta
      name="description"
      content="Tempo de Partir: Uma revista digital para quem busca desacelerar. Ensaios profundos sobre viagens, literatura, astroturismo e a arte de contemplar o mundo."
    />
    <meta
      name="keywords"
      content="viagem lenta, slow travel, revista de cultura, astroturismo, ensaios de viagem, literatura e viagem, brasil, cultura brasileira"
    />
    <meta name="author" content="Tempo de Partir" />
    <link rel="canonical" href="https://tempodepartir.com.br" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tempodepartir.com.br" />
    <meta
      property="og:title"
      content="Tempo de Partir | Revista Digital de Viagens e Cultura"
    />
    <meta
      property="og:description"
      content="O mundo é mais bonito quando a gente desacelera. Explore ensaios profundos sobre viagens e cultura."
    />
    <meta
      property="og:image"
      content="https://tempodepartir.com.br/assets/og-image.jpg"
    />
    <meta property="og:site_name" content="Tempo de Partir" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tempodepartir.com.br" />
    <meta
      property="twitter:title"
      content="Tempo de Partir | Revista Digital"
    />
    <meta
      property="twitter:description"
      content="Ensaios sobre viagens, cultura e a arte de desacelerar."
    />
    <meta
      property="twitter:image"
      content="https://tempodepartir.com.br/assets/og-image.jpg"
    />

    <!-- Dados Estruturados (JSON-LD) - Essencial para SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsMediaOrganization",
        "name": "Tempo de Partir",
        "url": "https://tempodepartir.com.br",
        "logo": "https://tempodepartir.com.br/assets/logo.png",
        "description": "Uma revista digital de viagens e cultura focada na desaceleração.",
        "sameAs": ["https://instagram.com/tempodepartir"],
        "brand": {
          "@type": "Brand",
          "name": "Tempo de Partir",
          "slogan": "O mundo é mais bonito quando a gente desacelera."
        }
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ledger&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Ledger"', "serif"],
              sans: ['"Urbanist"', "sans-serif"],
            },
            colors: {
              paper: "#f9f5f1",
              ink: "#01172f",
              earth: "#6b6f54",
              accent: "#c57658",
              gold: "#c9a86a",
              plum: "#8a4f7d",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --color-paper: #f9f5f1;
        --color-ink: #01172f;
        --color-earth: #6b6f54;
        --color-accent: #c57658;
        --color-gold: #c9a86a;
        --color-plum: #8a4f7d;
      }

      body {
        background-color: #f9f5f1;
        color: #01172f;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .animate-fade-in {
        animation: fadeIn 0.8s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }

      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(1, 23, 47, 0.1);
        border-radius: 10px;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(1, 23, 47, 0.2);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
          "react-router-dom": "https://esm.sh/react-router-dom@7.0.0?external=react,react-dom",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
